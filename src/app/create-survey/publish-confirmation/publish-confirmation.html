<dialog
  #dialog
  class="publish-confirmation"
  aria-labelledby="publish-confirmation-text"
  (close)="onDialogClosed()"
>
  <p id="publish-confirmation-text" class="publish-confirmation__text">
    Your survey is now published!
  </p>
  <button
    type="button"
    class="publish-confirmation__close"
    aria-label="Close and open the survey"
    (click)="close()"
  >
    <img class="publish-confirmation__close-icon" src="icons/close-dark.png" alt="" />
  </button>
</dialog>
