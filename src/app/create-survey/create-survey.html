<dialog
  #dialog
  class="create-survey"
  aria-labelledby="create-survey-title"
  (cancel)="onDialogCancel($event)"
  (close)="onDialogClosed()"
  (pointerdown)="onDialogPointerDown($event)"
  (click)="onDialogClick($event)"
>
  <img class="create-survey__logo" src="images/logo-dark.png" alt="Poll App" />
  <section class="create-survey__card">
    <header class="create-survey__header">
      <div class="create-survey__heading">
        <span class="badge badge--draft">Draft</span>
        <h1 id="create-survey-title" class="create-survey__title">Create new survey</h1>
      </div>
      <button
        type="button"
        class="button-secondary create-survey__close"
        aria-label="Cancel"
        [disabled]="isSaving()"
        (click)="close()"
      >
        <span class="create-survey__close-label">Cancel</span>
        <img class="create-survey__close-icon" src="icons/close-white.png" alt="" />
      </button>
    </header>
    <form class="create-survey__form" novalidate (submit)="publish($event)">
      <div class="create-survey__panel">
        <app-survey-meta-form [form]="metaForm()" [showAllErrors]="isPublishAttempted()" />
        <ol class="create-survey__questions">
          @for (question of questions().controls; track question; let index = $index) {
            <li class="create-survey__question">
              <app-question-editor
                [group]="question"
                [number]="index + 1"
                [showAllErrors]="isPublishAttempted()"
                (removed)="removeQuestion(index)"
              />
            </li>
          }
        </ol>
        @if (questions().length < maxQuestions) {
          <button
            type="button"
            class="button-secondary create-survey__add-question"
            (click)="addQuestion()"
          >
            Add next question
            <img class="create-survey__add-question-icon" src="icons/add-circle-white.png" alt="" />
          </button>
        }
      </div>
      <div class="create-survey__actions">
        @if (isSaveFailed()) {
          <p class="create-survey__save-error" role="alert">
            Your survey could not be published. Please try again.
          </p>
        }
        <button type="submit" class="button-primary create-survey__publish" [disabled]="isSaving()">
          {{ isSaving() ? 'Publishing …' : 'Publish' }}
          <img class="create-survey__publish-icon" src="icons/check-dark.png" alt="" />
        </button>
      </div>
    </form>
  </section>
</dialog>
