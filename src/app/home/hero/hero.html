<section class="hero content">
  <div class="hero__text">
    <h1 class="hero__title">Collect Feedback, Unlock Ideas</h1>
    <p class="hero__lead">
      Create and share surveys in minutes – from team events to workplace culture. Collect opinions,
      engage your audience, and turn feedback into action.
    </p>
    <button class="button-primary hero__button" type="button" (click)="openCreateSurvey()">
      New survey
      <img class="hero__button-icon" src="icons/add-circle-dark.png" alt="" />
    </button>
  </div>
  <div class="hero__illustration">
    <img class="hero__image hero__image--default" src="images/hero.png" alt="" />
    <img class="hero__image hero__image--hover" src="images/hero-hover.png" alt="" />
  </div>
</section>
